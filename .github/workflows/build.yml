name: build
on: [ pull_request, push ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 25
            minecraft: '26.1'
            fabric_api: '0.145.1+26.1'
            modmenu: '18.0.0-alpha.8'
            iris: '1.10.9+26.1-fabric'
            sodium: 'mc26.1.1-0.8.9-fabric'
          - java: 25
            minecraft: '26.1.2'
            fabric_api: '0.154.2+26.1.2'
            modmenu: '18.0.0-alpha.8'
            iris: '1.10.9+26.1-fabric'
            sodium: 'mc26.1.2-0.8.12-fabric'
          - java: 25
            minecraft: '26.2'
            fabric_api: '0.154.2+26.2'
            modmenu: '20.0.1'
            iris: '1.11.2+26.2-fabric'
            sodium: 'mc26.2-0.9.1-fabric'
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles the mod, runs the test suite (src/test), and produces the runtime jar.
      # This is the step the old workflow was missing entirely — without it no jar was ever
      # built and the tests never ran, so CI "passed" without actually verifying or producing
      # anything. (The old per-push scripts/ chmod + skipped verify step are gone.)
      - name: build and test
        run: ./gradlew ":${{ matrix.minecraft }}:build" --stacktrace

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      # Publish or refresh a notes-only GitHub Release on every push to main.
      # Jar distribution is handled outside GitHub Releases.
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          tag="v${version}"
          notes_file="$(mktemp)"
          {
            echo "FloydAddons ${version}"
            echo
            echo "Release published from ${GITHUB_SHA}."
            echo
            echo "Artifacts are distributed outside GitHub Releases."
          } > "$notes_file"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} exists — updating notes."
            gh release edit "$tag" \
              --title "FloydAddons ${version} (MC 26.1 / 26.1.2 / 26.2)" \
              --notes-file "$notes_file" \
              --target "$GITHUB_SHA"
          else
            echo "Creating release ${tag}."
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "FloydAddons ${version} (MC 26.1 / 26.1.2 / 26.2)" \
              --notes-file "$notes_file"
          fi
