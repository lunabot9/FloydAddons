name: build
on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 25
            minecraft: '26.1'
            fabric_api: '0.145.1+26.1'
            modmenu: '18.0.0-alpha.8'
            iris: '1.10.9+26.1-fabric'
            sodium: 'mc26.1.1-0.8.9-fabric'
          - java: 25
            minecraft: '26.1.2'
            fabric_api: '0.154.2+26.1.2'
            modmenu: '18.0.0-alpha.8'
            iris: '1.10.9+26.1-fabric'
            sodium: 'mc26.1.2-0.8.12-fabric'
          - java: 25
            minecraft: '26.2'
            fabric_api: '0.154.2+26.2'
            modmenu: '20.0.1'
            iris: '1.11.2+26.2-fabric'
            sodium: 'mc26.2-0.9.1-fabric'
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles the mod, runs the test suite (src/test), and produces the runtime jar.
      # This is the step the old workflow was missing entirely — without it no jar was ever
      # built and the tests never ran, so CI "passed" without actually verifying or producing
      # anything. (The old per-push scripts/ chmod + skipped verify step are gone.)
      - name: build and test
        run: ./gradlew ":${{ matrix.minecraft }}:build" --stacktrace

      # Every commit (PR, main, tag) leaves a downloadable runtime jar for this Minecraft version,
      # so a fix can be grabbed without cutting a release. Releases are tag-driven (see below).
      - name: upload runtime jar
        uses: actions/upload-artifact@v4
        with:
          name: FloydAddons-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/libs/FloydAddons-*-${{ matrix.minecraft }}.jar
          if-no-files-found: error

  release:
    # Releases are tag-driven: pushing v<mod_version> publishes the jar set for that exact commit.
    # Merging to main never bumps a version or publishes a release on its own.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: verify tag matches mod_version
        run: |
          set -euo pipefail
          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${version}." >&2
            exit 1
          fi

      - name: download runtime jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksum runtime jars
        run: |
          set -euo pipefail
          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          cd dist
          sha256sum FloydAddons-*.jar > "SHA256SUMS-v${version}.txt"
          cat "SHA256SUMS-v${version}.txt"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          tag="v${version}"
          release_notes="release-notes-${version}.md"
          if [[ ! -f "$release_notes" ]]; then
            echo "Missing ${release_notes}; refusing to publish a release without notes." >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} exists — refreshing notes and assets."
            gh release edit "$tag" \
              --title "FloydAddons ${version} (MC 26.1 / 26.1.2 / 26.2)" \
              --notes-file "$release_notes"
            gh release upload "$tag" dist/FloydAddons-*.jar "dist/SHA256SUMS-v${version}.txt" --clobber
          else
            echo "Creating release ${tag}."
            gh release create "$tag" \
              --verify-tag \
              --title "FloydAddons ${version} (MC 26.1 / 26.1.2 / 26.2)" \
              --notes-file "$release_notes" \
              dist/FloydAddons-*.jar "dist/SHA256SUMS-v${version}.txt"
          fi
